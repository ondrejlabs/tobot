name: Smoke Test

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'readme.md'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'readme.md'
      - '.gitignore'
  schedule:
    # Runs at 06:00 UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch:
  
jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Base Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install huggingface_hub
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Fetch Private Test Data
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        # Runs your script to pull data into ./tests/data
        python tests/get_data_from_hf.py

    - name: Run App and Compare Output
      env:
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      run: |
        # Check if the test data directory exists and is not empty
        if [ ! -d "./tests/data" ] || [ -z "$(ls -A ./tests/data)" ]; then
          echo "Notice: Test data is missing or empty. Skipping smoke tests (expected on public forks)."
          exit 0
        fi

        echo "Test data found. Running smoke test..."

        # Overwrite the default mapping file with the test-specific mapping file
        echo "Applying test mapping rules..."
        cp -f ./tests/mapping.csv ./mapping.csv

        # --- Retry Logic Initialization ---
        max_retries=2
        attempt=1
        success=false

        while [ $attempt -le $max_retries ]; do
          echo "--- Attempt $attempt of $max_retries ---"
          
          # Run the application and save the output to a temporary file
          python main.py -f ./tests/data > ./tests/actual_output.txt

          # Compare the "Total Tax:" lines against the reference file
          if diff -u <(grep "Total Tax:" tests/reference_output.txt | sort) <(grep "Total Tax:" tests/actual_output.txt | sort); then
            echo "Success: 'Total Tax' lines match the reference perfectly."
            success=true
            break # Exits the while loop on success
          else
            echo "Failure: 'Total Tax' lines do not match on attempt $attempt."
            attempt=$((attempt + 1))
            
            # Pause briefly before the next attempt if we haven't exceeded max_retries
            if [ $attempt -le $max_retries ]; then
              echo "Waiting 10 seconds before retrying..."
              sleep 10
            fi
          fi
        done

        # If the loop finishes and success is still false, fail the step
        if [ "$success" = false ]; then
          echo "All $max_retries attempts failed. Failing the workflow."
          exit 1
        fi